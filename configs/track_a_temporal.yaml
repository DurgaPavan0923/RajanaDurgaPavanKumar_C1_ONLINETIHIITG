# Track A Configuration: Timestamped Sensor Stream (Underwater Environmental Monitoring)
track: "A"
raw_data_path: "data/01_raw/underwater_sensor_stream.csv"
timestamp_column: "timestamp"

split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  shuffle: false  # Chronological order strictly preserved

audit:
  ranges:
    temperature: [-2.0, 45.0]
    dissolved_oxygen: [0.0, 25.0]
    ph: [0.0, 14.0]
    conductivity: [10.0, 2000.0]
    turbidity: [0.0, 100.0]
    pressure: [0.0, 500.0]
  expected_sampling_delta_seconds: 3600  # 1 hour
  max_gap_seconds: 14400                # 4 hours

preprocessing:
  resample_rule: "1h"
  interpolation_method: "time"
  max_ffill_consecutive: 3
  scaling_strategy: "standard"

features:
  targets_to_forecast: ["temperature", "dissolved_oxygen", "ph", "turbidity"]
  forecast_horizon_steps: 6             # 6 hours ahead
  lag_steps: [1, 2, 3, 6, 12, 24]
  rolling_windows: [3, 6, 12, 24]
  include_diurnal_cyclical: true

anomaly_detection:
  method: "isolation_forest"
  contamination: 0.02
  z_score_threshold: 3.5

forecasting:
  models:
    - name: "persistence"
      type: "baseline"
    - name: "linear_regression"
      type: "linear"
    - name: "random_forest_regressor"
      type: "ensemble"
      params:
        n_estimators: 150
        max_depth: 8
        random_state: 42
    - name: "xgboost_regressor"
      type: "gradient_boost"
      params:
        n_estimators: 200
        max_depth: 5
        learning_rate: 0.05
        random_state: 42
