[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "water-potability-monitor"
version = "2.1.0"
description = "Water Potability and Underwater Environmental Monitoring: Anomaly Detection, Forecasting, and Calibrated Classification"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Rajana Durga Pavan Kumar (Group C1, TIH IIT Guwahati)" }
]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.2",
    "pydantic>=2.7.4",
    "pyyaml>=6.0.1",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1"
]

[project.optional-dependencies]
dev = [
    "xgboost>=2.0.3",
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.8",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "streamlit>=1.35.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4"]
ignore = ["E501", "N803", "N806", "E402", "B008", "A002", "W293", "W291", "UP017", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
pythonpath = ["."]

[tool.vercel]
entrypoint = "api.index:app"
